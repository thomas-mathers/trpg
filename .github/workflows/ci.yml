name: CI

on:
  push:
    branches-ignore: [main]
    
  pull_request:
    branches: [main]
    
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    
    outputs:
      spa: ${{ steps.filter.outputs.spa }}
      api: ${{ steps.filter.outputs.api }}
      
    steps:
      - uses: actions/checkout@v7
        
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spa:
              - 'spa/**'
            api:
              - 'api/**'
            
  api:
    needs: changes

    if: needs.changes.outputs.api == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api
    
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore TRPG.sln

      - name: Build
        run: dotnet build TRPG.sln --no-restore

      - name: Test
        timeout-minutes: 10
        run: dotnet test TRPG.sln --no-build

  spa:
    needs: changes

    if: needs.changes.outputs.spa == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The SPA configures pnpm with a project-local store.  setup-node resolves
      # its built-in pnpm cache from the repository root, so cache that store
      # explicitly instead.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: spa/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('spa/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

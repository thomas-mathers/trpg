name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TRPG.sln

      - name: Build
        run: dotnet build TRPG.sln --no-restore

      - name: Test
        run: dotnet test TRPG.sln --no-build
